<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fermi Payment Simulator - 450ms Block Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-card .subvalue {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .transaction-item {
            background: #f5f5f5;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .transaction-item .tx-hash {
            font-family: monospace;
            font-size: 0.9em;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .transaction-item .tx-details {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .timing-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ Fermi Payment Simulator</h1>
            <p>Experience BNB Chain's 450ms Block Time & Sub-Second Finality</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>Block Time</h3>
                <div class="value" id="blockTime">450ms</div>
                <div class="subvalue">Fermi Upgrade</div>
            </div>
            <div class="stat-card">
                <h3>Fast Finality</h3>
                <div class="value" id="finality">~1.1s</div>
                <div class="subvalue">Theoretical</div>
            </div>
            <div class="stat-card">
                <h3>Current Block</h3>
                <div class="value" id="currentBlock">-</div>
                <div class="subvalue">BSC Testnet</div>
            </div>
            <div class="stat-card">
                <h3>Your Balance</h3>
                <div class="value" id="balance">-</div>
                <div class="subvalue">BNB</div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2>Send Payment</h2>
                <div id="message"></div>
                <form id="paymentForm">
                    <div class="form-group">
                        <label for="recipient">Recipient Address</label>
                        <input type="text" id="recipient" placeholder="0x..." required>
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (BNB)</label>
                        <input type="number" id="amount" step="0.001" min="0.001" placeholder="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="note">Payment Note (Optional)</label>
                        <textarea id="note" rows="3" placeholder="Payment description..."></textarea>
                    </div>
                    <button type="submit" class="btn" id="sendBtn">Send Payment</button>
                </form>
            </div>
            
            <div class="card">
                <h2>Recent Transactions</h2>
                <div id="history">
                    <div class="loading">Loading transaction history...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Load network stats and balance on page load
        async function loadStats() {
            try {
                const [statsRes, balanceRes] = await Promise.all([
                    fetch('/api/network_stats'),
                    fetch('/api/balance')
                ]);
                
                const stats = await statsRes.json();
                const balance = await balanceRes.json();
                
                if (stats.success) {
                    document.getElementById('currentBlock').textContent = stats.current_block.toLocaleString();
                    document.getElementById('blockTime').textContent = (stats.fermi_block_time_seconds * 1000).toFixed(0) + 'ms';
                    document.getElementById('finality').textContent = stats.theoretical_finality_seconds.toFixed(2) + 's';
                }
                
                if (balance.success) {
                    document.getElementById('balance').textContent = balance.balance_bnb.toFixed(4) + ' BNB';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Load transaction history
        async function loadHistory() {
            try {
                const res = await fetch('/api/history?limit=5');
                const data = await res.json();
                
                const historyDiv = document.getElementById('history');
                
                if (data.success && data.transactions.length > 0) {
                    historyDiv.innerHTML = data.transactions.map(tx => `
                        <div class="transaction-item">
                            <div class="tx-hash">${tx.transaction_hash.substring(0, 20)}...</div>
                            <div><strong>To:</strong> ${tx.recipient.substring(0, 10)}...</div>
                            <div><strong>Amount:</strong> ${tx.amount} BNB</div>
                            ${tx.note ? `<div><strong>Note:</strong> ${tx.note}</div>` : ''}
                            <div class="tx-details">
                                <span><strong>Block:</strong> ${tx.block_number}</span>
                                <span class="timing-badge">${tx.timing.confirmation_time_seconds.toFixed(3)}s</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyDiv.innerHTML = '<div class="loading">No transactions yet</div>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history').innerHTML = '<div class="error">Error loading history</div>';
            }
        }
        
        // Handle payment form submission
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sendBtn = document.getElementById('sendBtn');
            const messageDiv = document.getElementById('message');
            
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            messageDiv.innerHTML = '<div class="loading">Submitting transaction...</div>';
            
            const recipient = document.getElementById('recipient').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const note = document.getElementById('note').value;
            
            try {
                const startTime = Date.now();
                const res = await fetch('/api/send_payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        recipient_address: recipient,
                        amount: amount,
                        note: note
                    })
                });
                
                const result = await res.json();
                const endTime = Date.now();
                
                if (result.success) {
                    messageDiv.innerHTML = `
                        <div class="success">
                            <strong>Payment Successful!</strong><br>
                            Transaction: ${result.transaction_hash.substring(0, 20)}...<br>
                            Confirmed in ${result.timing.confirmation_time_seconds.toFixed(3)}s<br>
                            Block: ${result.block_number}
                        </div>
                    `;
                    
                    // Reset form
                    document.getElementById('paymentForm').reset();
                    
                    // Reload history and balance
                    loadHistory();
                    loadStats();
                } else {
                    messageDiv.innerHTML = `<div class="error">Error: ${result.error}</div>`;
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Payment';
            }
        });
        
        // Initial load
        loadStats();
        loadHistory();
        
        // Refresh stats every 5 seconds
        setInterval(() => {
            loadStats();
            loadHistory();
        }, 5000);
    </script>
</body>
</html>
